openapi: 3.0.3
info:
  title: Cell Platform API
  version: 0.1.0
  description: |
    The only door into a cell for the UI, the CLI and agents. Everything
    that changes an app (install, update, access, restore, restart, remove)
    becomes a change request; the list of them is the change log. A change
    waits until an admin approves it in a call of its own, then runs as
    backup, change, health check and, if the app does not become healthy,
    rollback. A restart keeps spec and data, so it has no backup and no
    rollback.

    Authentication: a bearer token from the cell's identity. Get one at
    `https://auth.<cell domain>/application/o/token/` with
    `grant_type=client_credentials`, `client_id=cell-api`, `username`, an
    app password (`POST /v0/users/{name}/tokens`) as `password` and
    `scope=openid profile`. The console logs in with its own client
    (`GET /v0/login`); its tokens are valid here too.

    Roles come from identity groups: members of `cell-admins` may do
    everything, members of `cell-agents` read everything and propose
    changes, members of `cell-viewers` read the state of the cell only:
    catalog, apps, their backups and access, changes, live events, machines
    and the backup target. For viewers an app's `spec` holds only `access`,
    and a change has no `patch` and, when an agent asked for it, no
    `reason`; status messages (conditions, changes, backups, events, the
    backup check) and the backup target's `accessKey` are left out: those
    can carry configuration values or quote logs. People,
    groups, tasks, pods, app events and logs answer viewers with 403. Every
    other account
    of the identity (people who only use apps) has the role `none`: it may
    ask `GET /v0/whoami` and gets 403 everywhere else.

    Agents work in tasks (`/v0/tasks`). Except for finding, claiming and
    finishing tasks, every call of an agent names the task it belongs to in
    the header `X-Cell-Task`; the API records the call as a step of the
    task before it serves it, and changes the agent proposes name the task.
    An agent proposes changes only for the app of its task (403 otherwise).
    A call outside a running task of the agent is refused (400, 404, 409);
    that is why every operation can answer with an error. Tasks are for
    agents and admins: results can quote logs.
servers:
  - url: https://api.cell.localhost
security:
  - bearer: []
paths:
  /healthz:
    get:
      operationId: healthz
      security: []
      responses:
        "200": {description: The API is up., content: {text/plain: {schema: {type: string}}}}
  /openapi.yaml:
    get:
      operationId: openapi
      security: []
      responses:
        "200": {description: This document., content: {application/yaml: {schema: {type: string}}}}
  /v0/login:
    get:
      operationId: login
      security: []
      description: |
        How a first-party client (the console) logs its users in: an OpenID
        Connect authorization code login with PKCE at the cell's identity.
        The client exchanges the code at `tokenEndpoint` itself and calls
        the API with the access token.
      responses:
        default: {$ref: "#/components/responses/Error"}
        "200": {description: The login., content: {application/json: {schema: {$ref: "#/components/schemas/Login"}}}}
  /v0/whoami:
    get:
      operationId: whoami
      responses:
        default: {$ref: "#/components/responses/Error"}
        "200": {description: The caller., content: {application/json: {schema: {$ref: "#/components/schemas/Caller"}}}}
        "401": {$ref: "#/components/responses/Error"}
  /v0/catalog:
    get:
      operationId: listCatalog
      responses:
        default: {$ref: "#/components/responses/Error"}
        "200":
          description: Apps that can be installed.
          content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/CatalogEntry"}}}}
        "401": {$ref: "#/components/responses/Error"}
  /v0/catalog/{name}:
    parameters: [{$ref: "#/components/parameters/name"}]
    get:
      operationId: getCatalogEntry
      responses:
        default: {$ref: "#/components/responses/Error"}
        "200":
          description: A catalog entry with its manifest.
          content: {application/json: {schema: {$ref: "#/components/schemas/CatalogEntry"}}}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /v0/apps:
    get:
      operationId: listApps
      responses:
        default: {$ref: "#/components/responses/Error"}
        "200":
          description: Installed apps.
          content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/App"}}}}
        "401": {$ref: "#/components/responses/Error"}
    post:
      operationId: installApp
      description: |
        Proposes to install an app from the catalog or from a manifest (an
        agent packaged it). The cluster checks the app against its schema
        and rules first (dry run), so a wrong manifest is refused with 400
        now, not after approval. An install from a manifest is high risk. 409
        if the name or the subdomain is taken. Data an earlier installation
        of the name left behind goes to the new app; such a change is high
        risk and says so.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/InstallRequest"}}}
      responses:
        default: {$ref: "#/components/responses/Error"}
        "202": {$ref: "#/components/responses/Change"}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /v0/apps/{name}:
    parameters: [{$ref: "#/components/parameters/name"}]
    get:
      operationId: getApp
      responses:
        default: {$ref: "#/components/responses/Error"}
        "200": {description: The app., content: {application/json: {schema: {$ref: "#/components/schemas/App"}}}}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
    patch:
      operationId: updateApp
      description: |
        Proposes a JSON merge patch on the app's manifest, for example a new
        version. The API rates the risk: a change of access groups only is
        low, of the version only medium, anything else high. 409 if the new
        subdomain is taken.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/UpdateRequest"}}}
      responses:
        default: {$ref: "#/components/responses/Error"}
        "202": {$ref: "#/components/responses/Change"}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
    delete:
      operationId: removeApp
      description: |
        Proposes to remove the app after a backup. Its data stays in the cell
        for a reinstall, unless deleteData is true; its backups stay in the
        bucket either way.
      parameters:
        - {name: deleteData, in: query, schema: {type: boolean, default: false}}
        - {name: reason, in: query, schema: {type: string}}
      responses:
        default: {$ref: "#/components/responses/Error"}
        "202": {$ref: "#/components/responses/Change"}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /v0/apps/{name}/backups:
    parameters: [{$ref: "#/components/parameters/name"}]
    get:
      operationId: listBackups
      responses:
        default: {$ref: "#/components/responses/Error"}
        "200":
          description: Backups of the app, newest first.
          content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/Backup"}}}}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
    post:
      operationId: createBackup
      description: Starts a backup now (admins; it changes nothing, so it needs no approval).
      responses:
        default: {$ref: "#/components/responses/Error"}
        "201": {description: Backup started., content: {application/json: {schema: {$ref: "#/components/schemas/Backup"}}}}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /v0/apps/{name}/restore:
    parameters: [{$ref: "#/components/parameters/name"}]
    post:
      operationId: restoreApp
      description: Proposes to bring back the data of a backup; the current state is backed up first.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/RestoreRequest"}}}
      responses:
        default: {$ref: "#/components/responses/Error"}
        "202": {$ref: "#/components/responses/Change"}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /v0/apps/{name}/restart:
    parameters: [{$ref: "#/components/parameters/name"}]
    post:
      operationId: restartApp
      description: >-
        Proposes to roll out new pods of every workload of the app. Spec and
        data stay as they are, so the change takes no backup and has nothing
        to roll back; pods that do not become healthy in time fail it.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/RestartRequest"}}}
      responses:
        default: {$ref: "#/components/responses/Error"}
        "202": {$ref: "#/components/responses/Change"}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /v0/apps/{name}/access:
    parameters: [{$ref: "#/components/parameters/name"}]
    get:
      operationId: getAccess
      responses:
        default: {$ref: "#/components/responses/Error"}
        "200": {description: Who may use the app., content: {application/json: {schema: {$ref: "#/components/schemas/Access"}}}}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
    put:
      operationId: setAccess
      description: Proposes to limit the app to members of the given groups (empty means every user).
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/Access"}}}
      responses:
        default: {$ref: "#/components/responses/Error"}
        "202": {$ref: "#/components/responses/Change"}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /v0/users:
    get:
      operationId: listUsers
      responses:
        default: {$ref: "#/components/responses/Error"}
        "200":
          description: People and agent accounts.
          content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/User"}}}}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
    post:
      operationId: createUser
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/UserRequest"}}}
      responses:
        default: {$ref: "#/components/responses/Error"}
        "201": {description: Created., content: {application/json: {schema: {$ref: "#/components/schemas/User"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /v0/users/{name}/tokens:
    parameters: [{$ref: "#/components/parameters/name"}]
    post:
      operationId: createUserToken
      description: Creates an app password for API logins; it is shown only in this answer.
      responses:
        default: {$ref: "#/components/responses/Error"}
        "201": {description: Created., content: {application/json: {schema: {$ref: "#/components/schemas/Token"}}}}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /v0/groups:
    get:
      operationId: listGroups
      responses:
        default: {$ref: "#/components/responses/Error"}
        "200":
          description: Groups with their members.
          content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/Group"}}}}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
    post:
      operationId: createGroup
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/GroupRequest"}}}
      responses:
        default: {$ref: "#/components/responses/Error"}
        "201": {description: Created., content: {application/json: {schema: {$ref: "#/components/schemas/Group"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /v0/groups/{name}/members:
    parameters: [{$ref: "#/components/parameters/name"}]
    patch:
      operationId: changeGroupMembers
      description: Adds and removes single members; everyone else stays as they are, so two admins editing one group cannot undo each other.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/MemberChange"}}}
      responses:
        default: {$ref: "#/components/responses/Error"}
        "200": {description: The group afterwards., content: {application/json: {schema: {$ref: "#/components/schemas/Group"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /v0/apps/{name}/pods:
    parameters: [{$ref: "#/components/parameters/name"}]
    get:
      operationId: listPods
      description: The app's pods, newest first, with container states, restarts and last exit.
      responses:
        default: {$ref: "#/components/responses/Error"}
        "200":
          description: Pods.
          content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/Pod"}}}}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /v0/apps/{name}/logs:
    parameters: [{$ref: "#/components/parameters/name"}]
    get:
      operationId: appLogs
      description: The end of a container's log, at most 512 KiB.
      parameters:
        - {name: pod, in: query, description: "Default: the app's newest pod.", schema: {type: string}}
        - {name: container, in: query, description: "Default: the pod's first container.", schema: {type: string}}
        - {name: tail, in: query, schema: {type: integer, minimum: 1, maximum: 5000, default: 200}}
        - {name: previous, in: query, description: The container's previous run (after a crash)., schema: {type: boolean, default: false}}
      responses:
        default: {$ref: "#/components/responses/Error"}
        "200":
          description: Log lines; the header X-Cell-Pod names the pod.
          content: {text/plain: {schema: {type: string}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /v0/apps/{name}/events:
    parameters: [{$ref: "#/components/parameters/name"}]
    get:
      operationId: appEvents
      description: The newest Kubernetes events (at most 100) in the app's namespace.
      responses:
        default: {$ref: "#/components/responses/Error"}
        "200":
          description: Events, newest first.
          content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/AppEvent"}}}}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /v0/tasks:
    get:
      operationId: listTasks
      parameters:
        - {name: app, in: query, schema: {type: string}}
        - {name: phase, in: query, schema: {type: string, enum: [Pending, Running, Succeeded, Failed]}}
      responses:
        default: {$ref: "#/components/responses/Error"}
        "200":
          description: Tasks, newest first.
          content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/Task"}}}}
        "401": {$ref: "#/components/responses/Error"}
    post:
      operationId: createTask
      description: |
        Asks an agent for work: diagnose an installed app, or package a
        Compose file as a new app. The operator creates diagnose tasks by
        itself when an app needs attention.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/TaskRequest"}}}
      responses:
        default: {$ref: "#/components/responses/Error"}
        "201": {description: The task., content: {application/json: {schema: {$ref: "#/components/schemas/Task"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /v0/tasks/{name}:
    parameters: [{$ref: "#/components/parameters/task"}]
    get:
      operationId: getTask
      responses:
        default: {$ref: "#/components/responses/Error"}
        "200": {description: The task with the changes proposed in it., content: {application/json: {schema: {$ref: "#/components/schemas/Task"}}}}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /v0/tasks/{name}/claim:
    parameters: [{$ref: "#/components/parameters/task"}]
    post:
      operationId: claimTask
      description: An agent takes a pending task; 409 if it is not pending (any more).
      responses:
        default: {$ref: "#/components/responses/Error"}
        "200": {description: The task., content: {application/json: {schema: {$ref: "#/components/schemas/Task"}}}}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /v0/tasks/{name}/finish:
    parameters: [{$ref: "#/components/parameters/task"}]
    post:
      operationId: finishTask
      description: The agent that works on the task ends it with its answer.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/TaskResult"}}}
      responses:
        default: {$ref: "#/components/responses/Error"}
        "200": {description: The task., content: {application/json: {schema: {$ref: "#/components/schemas/Task"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /v0/changes:
    get:
      operationId: listChanges
      parameters:
        - {name: app, in: query, schema: {type: string}}
      responses:
        default: {$ref: "#/components/responses/Error"}
        "200":
          description: The change log, newest first.
          content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/ChangeRequest"}}}}
        "401": {$ref: "#/components/responses/Error"}
  /v0/changes/{name}:
    parameters: [{$ref: "#/components/parameters/change"}]
    get:
      operationId: getChange
      responses:
        default: {$ref: "#/components/responses/Error"}
        "200": {description: The change., content: {application/json: {schema: {$ref: "#/components/schemas/ChangeRequest"}}}}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /v0/changes/{name}/approve:
    parameters: [{$ref: "#/components/parameters/change"}]
    post:
      operationId: approveChange
      responses:
        default: {$ref: "#/components/responses/Error"}
        "200": {description: The change., content: {application/json: {schema: {$ref: "#/components/schemas/ChangeRequest"}}}}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /v0/changes/{name}/reject:
    parameters: [{$ref: "#/components/parameters/change"}]
    post:
      operationId: rejectChange
      responses:
        default: {$ref: "#/components/responses/Error"}
        "200": {description: The change., content: {application/json: {schema: {$ref: "#/components/schemas/ChangeRequest"}}}}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /v0/events:
    get:
      operationId: events
      description: |
        Server-sent events: one JSON `Event` per change of an app, backup,
        restore or change request. The stream ends when a watch ends;
        reconnect and read the current state again.
      responses:
        default: {$ref: "#/components/responses/Error"}
        "200": {description: Event stream., content: {text/event-stream: {schema: {type: string}}}}
        "401": {$ref: "#/components/responses/Error"}
  /v0/nodes:
    get:
      operationId: listNodes
      description: The machines of the cell, the server first.
      responses:
        default: {$ref: "#/components/responses/Error"}
        "200":
          description: Machines.
          content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/Node"}}}}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
  /v0/nodes/joins:
    post:
      operationId: createJoin
      description: |
        A join key for one more machine, valid for an hour, and the command
        that joins a machine with it. Run the command as root on the new
        machine (Ubuntu LTS) and paste the key when it asks; it loads
        everything from the cell, and the machine shows up in
        `GET /v0/nodes`. The key works for one machine: once a machine has joined,
        the cell deletes every key made before, so add machines one
        after another. The machine must reach the cell's server, and the
        server it. 409: the cell takes no more
        machines (a local cell).
      responses:
        default: {$ref: "#/components/responses/Error"}
        "201": {description: The join command., content: {application/json: {schema: {$ref: "#/components/schemas/Join"}}}}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /v0/nodes/join.sh:
    get:
      operationId: joinScript
      security: []
      description: |
        The script the join command runs on the new machine. No login: it
        holds nothing secret. It asks for the join key on the terminal
        (`CELL_JOIN_KEY` instead, for a run without one), so the key is never
        in a URL or on the command line, and the cell checks it when the
        machine joins.
      responses:
        default: {$ref: "#/components/responses/Error"}
        "200": {description: A bash script., content: {text/x-shellscript: {schema: {type: string}}}}
        "409": {$ref: "#/components/responses/Error"}
  /v0/backup-target:
    get:
      operationId: getBackupTarget
      description: |
        Where the backups of the cell go, and the last check of a target an
        admin set. Never a secret.
      responses:
        default: {$ref: "#/components/responses/Error"}
        "200": {description: The backup target., content: {application/json: {schema: {$ref: "#/components/schemas/BackupTarget"}}}}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
    put:
      operationId: setBackupTarget
      description: |
        Sets an S3 bucket as the backup target. The cell first checks it: it
        writes and deletes a small object under `<bucket>/<prefix>`. Only
        if that works does the target change; otherwise it stays as it was.
        The switch waits for running backups, restores and changes, and
        new ones wait until the gateway runs the new target. Follow the check at `GET /v0/backup-target`
        (`check.state`).
        Backups made before stay in the old target. 409: a check is
        running.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/BackupTargetRequest"}}}
      responses:
        default: {$ref: "#/components/responses/Error"}
        "202": {description: The check runs., content: {application/json: {schema: {$ref: "#/components/schemas/BackupTarget"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
components:
  securitySchemes:
    bearer: {type: http, scheme: bearer, bearerFormat: JWT}
  parameters:
    name:
      name: name
      in: path
      required: true
      schema: {type: string, pattern: "^[a-z0-9]([a-z0-9._-]*[a-z0-9])?$", maxLength: 63}
    change:
      name: name
      in: path
      required: true
      schema: {type: string, maxLength: 253}
    task:
      name: name
      in: path
      required: true
      schema: {type: string, maxLength: 253}
  responses:
    Error:
      description: An error.
      content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
    Change:
      description: The change was recorded and waits for approval; follow it at /v0/changes/{name}.
      content: {application/json: {schema: {$ref: "#/components/schemas/ChangeRequest"}}}
  schemas:
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error: {type: string}
    Login:
      type: object
      additionalProperties: false
      required: [issuer, authorizationEndpoint, tokenEndpoint, endSessionEndpoint, clientId, redirectUri, scope]
      properties:
        issuer: {type: string}
        authorizationEndpoint: {type: string}
        tokenEndpoint: {type: string}
        endSessionEndpoint: {type: string}
        clientId: {type: string}
        redirectUri: {type: string}
        scope: {type: string}
    Caller:
      type: object
      additionalProperties: false
      required: [username, role, groups]
      properties:
        username: {type: string}
        role: {type: string, enum: [admin, agent, viewer, none]}
        groups: {type: array, items: {type: string}}
    CatalogEntry:
      type: object
      additionalProperties: false
      required: [name, title, version, source, auth, subdomain]
      properties:
        name: {type: string}
        title: {type: string}
        version: {type: string}
        source: {type: string, enum: [helm, image]}
        auth: {type: string, enum: [oidc, proxy, none]}
        subdomain: {type: string}
        manifest: {type: object, description: The app manifest (App spec)., additionalProperties: true}
    Condition:
      type: object
      additionalProperties: false
      required: [type, status]
      properties:
        type: {type: string}
        status: {type: string}
        reason: {type: string}
        message: {type: string}
    App:
      type: object
      additionalProperties: false
      required: [name, version, phase, groups, lastBackup, conditions, spec]
      properties:
        name: {type: string}
        title: {type: string}
        version: {type: string, description: Version the manifest asks for.}
        runningVersion: {type: string, description: Version of the last passed health check.}
        phase:
          type: string
          enum: ["", Installing, Ready, Updating, RollingBack, Restoring, NeedsAttention, Removing]
          description: Empty right after the app was created.
        url: {type: string}
        groups: {type: array, items: {type: string}, description: Groups who may use the app; empty means everyone.}
        lastBackup:
          type: object
          nullable: true
          additionalProperties: false
          required: [name, at]
          properties:
            name: {type: string}
            at: {type: string, format: date-time}
        conditions: {type: array, items: {$ref: "#/components/schemas/Condition"}}
        spec: {type: object, additionalProperties: true, description: The app manifest (App spec).}
    InstallRequest:
      type: object
      additionalProperties: false
      description: Exactly one of catalog and manifest.
      properties:
        catalog: {type: string, description: Catalog entry to install.}
        manifest: {type: object, additionalProperties: true, description: An app manifest (App spec) that is not in the catalog.}
        name: {type: string, description: "Name of the app (default: the catalog name; required with a manifest)."}
        subdomain: {type: string}
        groups: {type: array, items: {type: string}, description: Groups who may use the app (empty means everyone).}
        reason: {type: string}
    UpdateRequest:
      type: object
      additionalProperties: false
      required: [patch]
      properties:
        patch: {type: object, additionalProperties: true, description: JSON merge patch on the app's manifest.}
        reason: {type: string}
    RestoreRequest:
      type: object
      additionalProperties: false
      properties:
        backup: {type: string, description: "Backup name; default: the newest completed backup of the app in this cell."}
        reason: {type: string}
    RestartRequest:
      type: object
      additionalProperties: false
      properties:
        reason: {type: string}
    Access:
      type: object
      additionalProperties: false
      required: [groups]
      properties:
        groups: {type: array, items: {type: string}}
        reason: {type: string}
    ChangeRequest:
      type: object
      additionalProperties: false
      required: [name, app, action, requester, reason, risk, patch, approval, phase, createdAt, startedAt, finishedAt]
      properties:
        name: {type: string}
        app: {type: string}
        action: {type: string, enum: [install, update, remove, restore, restart]}
        requester:
          type: object
          additionalProperties: false
          required: [kind, name]
          properties:
            kind: {type: string, enum: [Human, Agent, Operator]}
            name: {type: string}
        reason: {type: string}
        risk: {type: string, enum: [low, medium, high]}
        patch: {type: object, nullable: true, additionalProperties: true, description: "update: JSON merge patch; install: the manifest."}
        restores: {type: string, description: "restore: the backup that comes back."}
        deleteData: {type: boolean, description: "remove: the app's data in the cell goes too."}
        approval:
          type: object
          additionalProperties: false
          required: [required, at]
          properties:
            required: {type: boolean}
            decision: {type: string, enum: [Approved, Rejected]}
            by: {type: string}
            at: {type: string, format: date-time, nullable: true}
        phase:
          type: string
          enum: ["", Pending, WaitingForApproval, Running, Succeeded, RolledBack, Failed, Rejected]
          description: Empty right after the change was recorded.
        message: {type: string}
        createdAt: {type: string, format: date-time}
        startedAt: {type: string, format: date-time, nullable: true}
        finishedAt: {type: string, format: date-time, nullable: true}
        backup: {type: string, description: "Backup taken before the change, or none."}
        restore: {type: string, description: Restore used for a rollback or restore.}
        task: {type: string, description: Task an agent proposed the change in.}
    Backup:
      type: object
      additionalProperties: false
      required: [name, app, phase, createdAt, completedAt]
      properties:
        name: {type: string}
        app: {type: string}
        reason: {type: string}
        phase: {type: string, enum: ["", Pending, Running, Completed, Failed]}
        message: {type: string}
        createdAt: {type: string, format: date-time}
        completedAt: {type: string, format: date-time, nullable: true}
    User:
      type: object
      additionalProperties: false
      required: [username, name, groups]
      properties:
        username: {type: string}
        name: {type: string}
        email: {type: string}
        groups: {type: array, items: {type: string}}
    UserRequest:
      type: object
      additionalProperties: false
      required: [username, name]
      properties:
        username: {type: string, pattern: "^[a-z0-9][a-z0-9._-]{1,62}$"}
        name: {type: string}
        email: {type: string}
        password: {type: string, description: Initial password for web logins.}
        groups: {type: array, items: {type: string}}
    Token:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token: {type: string}
    Group:
      type: object
      additionalProperties: false
      required: [name, members]
      properties:
        name: {type: string}
        members: {type: array, items: {type: string}}
    GroupRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: {type: string, pattern: "^[a-z0-9][a-z0-9._-]{1,62}$"}
    MemberChange:
      type: object
      additionalProperties: false
      properties:
        add: {type: array, items: {type: string}}
        remove: {type: array, items: {type: string}}
    Event:
      type: object
      additionalProperties: false
      required: [type, kind, name]
      properties:
        type: {type: string, enum: [ADDED, MODIFIED, DELETED]}
        kind: {type: string, enum: [App, ChangeRequest, Backup, Restore]}
        name: {type: string}
        app: {type: string}
        phase: {type: string}
        message: {type: string}
    Pod:
      type: object
      additionalProperties: false
      required: [name, phase, createdAt, containers]
      properties:
        name: {type: string}
        phase: {type: string}
        reason: {type: string}
        message: {type: string}
        createdAt: {type: string, format: date-time}
        containers:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [name, image, ready, restarts, state, lastExit]
            properties:
              name: {type: string}
              image: {type: string}
              ready: {type: boolean}
              restarts: {type: integer}
              state: {type: string, enum: ["", running, waiting, terminated]}
              reason: {type: string}
              message: {type: string}
              lastExit:
                type: object
                nullable: true
                additionalProperties: false
                required: [reason, exitCode, at]
                properties:
                  reason: {type: string}
                  exitCode: {type: integer}
                  message: {type: string}
                  at: {type: string, format: date-time}
    AppEvent:
      type: object
      additionalProperties: false
      required: [type, reason, object, message, count, last]
      properties:
        type: {type: string}
        reason: {type: string}
        object: {type: string, description: Kind/name of the object the event is about.}
        message: {type: string}
        count: {type: integer}
        last: {type: string, format: date-time}
    Task:
      type: object
      additionalProperties: false
      required: [name, kind, app, input, requester, phase, assignee, createdAt, startedAt, finishedAt, result, steps]
      properties:
        name: {type: string}
        kind: {type: string, enum: [diagnose, package]}
        app: {type: string}
        input: {type: string, description: "What the operator saw (diagnose) or the Compose file (package)."}
        requester:
          type: object
          additionalProperties: false
          required: [kind, name]
          properties:
            kind: {type: string, enum: [Human, Agent, Operator]}
            name: {type: string}
        phase: {type: string, enum: [Pending, Running, Succeeded, Failed]}
        assignee: {type: string}
        createdAt: {type: string, format: date-time}
        startedAt: {type: string, format: date-time, nullable: true}
        finishedAt: {type: string, format: date-time, nullable: true}
        result: {type: string, description: "The agent's answer: the cause and what it proposed, or why it could not."}
        steps:
          type: array
          description: The agent's API calls in the task, recorded before they were served.
          items:
            type: object
            additionalProperties: false
            required: [at, call]
            properties:
              at: {type: string, format: date-time}
              call: {type: string}
        changes: {type: array, items: {type: string}, description: Changes proposed in the task (single task only).}
    TaskRequest:
      type: object
      additionalProperties: false
      required: [kind, app]
      properties:
        kind: {type: string, enum: [diagnose, package]}
        app: {type: string, description: "The app to diagnose, or the name of the app to package."}
        input: {type: string, description: "package: the Compose file."}
    TaskResult:
      type: object
      additionalProperties: false
      required: [result]
      properties:
        result: {type: string}
        failed: {type: boolean, default: false}
    Node:
      type: object
      additionalProperties: false
      required: [name, role, ready, since, address, cpu, memory, disk, apps, system, os, version, joined]
      properties:
        name: {type: string}
        role: {type: string, enum: [server, agent], description: "server: runs the cell's control plane; agent: runs apps."}
        ready: {type: boolean}
        since: {type: string, format: date-time, description: Ready (or not) since.}
        address: {type: string, description: The address the other machines reach it on.}
        cpu: {type: integer, description: Cores.}
        memory: {type: integer, format: int64, description: Bytes.}
        disk: {type: integer, format: int64, description: "Bytes: Longhorn's disks where there are, else the machine's."}
        cpuUsed: {type: number, description: Cores in use; absent without a measurement.}
        memoryUsed: {type: integer, format: int64, description: Bytes in use; absent without a measurement.}
        diskUsed: {type: integer, format: int64, description: Bytes of `disk` in use; absent without Longhorn.}
        apps: {type: array, items: {type: string}, description: Apps with a pod on the machine.}
        system: {type: boolean, description: The cell's own services run here.}
        os: {type: string}
        version: {type: string, description: Kubernetes version of the machine.}
        joined: {type: string, format: date-time}
    Join:
      type: object
      additionalProperties: false
      required: [command, key, expiresAt]
      properties:
        command: {type: string, description: Run as root on the new machine; it holds no key.}
        key: {type: string, pattern: "^[a-z0-9]{6}\\.[a-z0-9]{16}$", description: "The join key: paste it when the command asks. Works for one machine."}
        expiresAt: {type: string, format: date-time}
    BackupTarget:
      type: object
      additionalProperties: false
      required: [configured]
      properties:
        configured: {type: boolean, description: Backups have somewhere to go.}
        kind: {type: string, enum: [s3, local, other], description: "s3: a bucket; local: a directory on the first machine; other: another rclone remote."}
        where: {type: string, description: The target in words.}
        endpoint: {type: string, description: s3 only.}
        region: {type: string, description: s3 only.}
        bucket: {type: string, description: s3 only.}
        prefix: {type: string, description: "Path in the target, also without one: the default for the next."}
        accessKey: {type: string, description: "s3 only: the access key id; its secret stays in the cell."}
        check: {$ref: "#/components/schemas/BackupCheck"}
    BackupCheck:
      type: object
      additionalProperties: false
      required: [state, target, at, by]
      description: The last check of a target an admin set; absent before the first.
      properties:
        state: {type: string, enum: [checking, passed, failed]}
        message: {type: string, description: "Why it failed; while checking, what a passed check waits for (running backups, restores and changes, then the gateway's restart)."}
        target: {type: string, description: The target that was checked.}
        at: {type: string, format: date-time, description: "When it was asked for while checking, when it ended afterwards."}
        by: {type: string}
    BackupTargetRequest:
      type: object
      additionalProperties: false
      required: [endpoint, bucket, accessKey, secretKey]
      properties:
        endpoint: {type: string, description: "https URL with a host only, such as https://fsn1.your-objectstorage.com. Plain http only with privateNetwork and an address of a private network as the host."}
        region: {type: string, description: "Default: us-east-1."}
        bucket: {type: string}
        accessKey: {type: string}
        secretKey: {type: string, description: Stays in the cell; no answer holds it.}
        prefix: {type: string, description: "Path in the bucket; default: the current one (the cell's domain)."}
        privateNetwork: {type: boolean, description: "Allows a plain http endpoint, on purpose: its host must be an IP address of a private network (10/8, 172.16/12, 192.168/16, loopback, link-local, 100.64/10, fc00::/7), never a host name. Ignored for https."}
