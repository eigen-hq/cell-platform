---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: tasks.cell.internal
spec:
  group: cell.internal
  names:
    kind: Task
    listKind: TaskList
    plural: tasks
    singular: task
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.kind
      name: Kind
      type: string
    - jsonPath: .spec.app
      name: App
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.assignee
      name: Assignee
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Task is work for an agent that no rule covers: find out why an app needs
          attention, turn a Compose file into a manifest, or do what a person asked. An agent claims it,
          works only through the platform API, and the API records every call it
          makes as a step, so the task is the agent's part of the change log. What
          the agent wants changed it proposes as ChangeRequests that name the task.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              app:
                description: |-
                  App to diagnose, the name the packaged app gets, or the app an ask is
                  about. An ask without one sees the cell, not the inside of an app.
                pattern: ^[a-z]([a-z0-9-]{0,38}[a-z0-9])?$
                type: string
              input:
                description: |-
                  Input: what the operator saw (diagnose), the Compose file (package)
                  or the person's request (ask).
                maxLength: 65536
                type: string
              kind:
                description: |-
                  Kind: diagnose (find the cause of an app's trouble and propose the
                  repair), package (make a manifest from Input and propose installing
                  it as App) or ask (do what a person asked in Input, about App if set).
                enum:
                - diagnose
                - package
                - ask
                type: string
              requester:
                properties:
                  kind:
                    enum:
                    - Human
                    - Agent
                    - Operator
                    type: string
                  name:
                    type: string
                required:
                - kind
                - name
                type: object
            required:
            - kind
            - requester
            type: object
            x-kubernetes-validations:
            - message: a task is immutable; create a new one
              rule: self == oldSelf
            - message: diagnose and package tasks name an app
              rule: self.kind == 'ask' || has(self.app)
          status:
            properties:
              answer:
                description: |-
                  Answer is the agent's answer in parts, when it gave one (E-100):
                  what it understood, what it found with the steps that show it, and
                  the options with the one it recommends.
                properties:
                  findings:
                    items:
                      description: |-
                        TaskFinding is one thing the agent found, with the steps of the task
                        whose results show it.
                      properties:
                        claim:
                          maxLength: 1000
                          minLength: 1
                          type: string
                        status:
                          enum:
                          - confirmed
                          - suspected
                          - ruledOut
                          type: string
                        steps:
                          description: Steps are numbers of the task's steps (from
                            1).
                          items:
                            format: int32
                            minimum: 1
                            type: integer
                          maxItems: 20
                          type: array
                      required:
                      - claim
                      - status
                      type: object
                    maxItems: 12
                    type: array
                  options:
                    items:
                      description: |-
                        TaskOption is one way to go on. At most one option of an answer is
                        recommended and at most one names a change.
                      properties:
                        change:
                          description: Change is the ChangeRequest the agent proposed
                            in the task for it.
                          maxLength: 253
                          type: string
                        recommended:
                          type: boolean
                        title:
                          maxLength: 200
                          minLength: 1
                          type: string
                        why:
                          maxLength: 1000
                          type: string
                      required:
                      - title
                      type: object
                    maxItems: 4
                    type: array
                  summary:
                    description: Summary is the answer in a few sentences.
                    maxLength: 2000
                    minLength: 1
                    type: string
                  understood:
                    description: Understood is what the agent took the task to be.
                    maxLength: 1000
                    type: string
                required:
                - summary
                type: object
              assignee:
                type: string
              finishedAt:
                format: date-time
                type: string
              phase:
                description: |-
                  Pending until an agent claims it, Running while it works, then
                  Succeeded, Failed, or WaitingForInput when the agent asked the person
                  something. A reply makes it Pending again, for the same agent (E-99).
                  A stop makes it Failed (E-101).
                enum:
                - Pending
                - WaitingForApproval
                - WaitingForInput
                - Running
                - Completed
                - Failed
                - Succeeded
                - RolledBack
                - Rejected
                type: string
              reply:
                description: |-
                  Reply is a person's last reply: the answer to the agent's question or
                  a follow-up. The agent adds it to the task's transcript, which keeps
                  every reply, and goes on (E-99).
                properties:
                  at:
                    format: date-time
                    type: string
                  by:
                    type: string
                  text:
                    maxLength: 16384
                    type: string
                required:
                - at
                - by
                - text
                type: object
              result:
                description: |-
                  Result is the agent's answer: the cause it found and what it
                  proposed, or why it could not. With an Answer it is the answer as
                  plain text.
                maxLength: 16384
                type: string
              startedAt:
                format: date-time
                type: string
              steps:
                description: |-
                  Steps are the agent's API calls, recorded by the API before it
                  serves them.
                items:
                  properties:
                    at:
                      format: date-time
                      type: string
                    call:
                      description: Call is the method and path (with query) of the
                        API call.
                      maxLength: 1024
                      type: string
                  required:
                  - at
                  - call
                  type: object
                maxItems: 200
                type: array
              stopped:
                description: |-
                  Stopped tells who stopped the task and when (E-101); a reply clears
                  it.
                properties:
                  at:
                    format: date-time
                    type: string
                  by:
                    type: string
                required:
                - at
                - by
                type: object
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
