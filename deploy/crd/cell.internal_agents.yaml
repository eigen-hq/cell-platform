---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: agents.cell.internal
spec:
  group: cell.internal
  names:
    kind: Agent
    listKind: AgentList
    plural: agents
    singular: agent
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.kinds
      name: Kinds
      type: string
    - jsonPath: .spec.apps
      name: Apps
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Agent is one agent of the cell (E-97): an account of its own in the
          identity, the kinds of tasks it takes, the apps whose tasks it takes and
          the tools it may call. The operator runs it as Deployment
          cell-agent-<name> with the credentials in Secret cell-agent-<name>; the
          API checks every call of the agent against this spec.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              apps:
                description: |-
                  Apps whose tasks the agent takes; * stands for every app and for
                  tasks about the whole cell.
                items:
                  pattern: ^(\*|[a-z]([a-z0-9-]{0,38}[a-z0-9])?)$
                  type: string
                minItems: 1
                type: array
              instructions:
                description: Instructions are added to the agent's system prompt.
                maxLength: 8192
                type: string
              kinds:
                description: 'Kinds of tasks the agent takes: diagnose, package, ask.'
                items:
                  enum:
                  - diagnose
                  - package
                  - ask
                  type: string
                minItems: 1
                type: array
              paused:
                description: |-
                  Paused stops the agent: its Deployment runs no pod, and its tasks
                  wait for another agent that takes them.
                type: boolean
              tools:
                description: |-
                  Tools are the operationIds of the platform API marked x-agent that the
                  agent may call; * stands for all of them.
                items:
                  pattern: ^(\*|[a-zA-Z]+)$
                  type: string
                minItems: 1
                type: array
            required:
            - apps
            - kinds
            - tools
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: an agent's name is a lowercase name of at most 30 characters
          rule: self.metadata.name.matches('^[a-z]([a-z0-9-]{0,28}[a-z0-9])?$')
        - message: 'llm is taken: Secret cell-agent-llm holds the model settings'
          rule: self.metadata.name != 'llm'
    served: true
    storage: true
    subresources: {}
