---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: apps.cell.internal
spec:
  group: cell.internal
  names:
    kind: App
    listKind: AppList
    plural: apps
    singular: app
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.version
      name: Version
      type: string
    - jsonPath: .status.url
      name: URL
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          App is an installed app. Its spec is the catalog manifest plus the
          customer's choices; see docs/app-manifest.md.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              access:
                properties:
                  auth:
                    properties:
                      mode:
                        enum:
                        - oidc
                        - proxy
                        - none
                        type: string
                      redirectPaths:
                        description: RedirectPaths are the OIDC callback paths of
                          the app (mode oidc).
                        items:
                          type: string
                        type: array
                      secretKeys:
                        description: |-
                          SecretKeys names the keys of the client secret ({{ .auth.secretName }})
                          the way the app or chart expects them.
                        properties:
                          clientId:
                            default: clientId
                            type: string
                          clientSecret:
                            default: clientSecret
                            type: string
                        type: object
                        x-kubernetes-validations:
                        - message: clientId and clientSecret must be different keys
                          rule: '(has(self.clientId) ? self.clientId : ''clientId'')
                            != (has(self.clientSecret) ? self.clientSecret : ''clientSecret'')'
                    required:
                    - mode
                    type: object
                    x-kubernetes-validations:
                    - message: changing the login mode is not supported; remove and
                        reinstall the app
                      rule: self.mode == oldSelf.mode
                  groups:
                    description: |-
                      Groups of the identity whose members may use the app; empty means
                      every user of the cell.
                    items:
                      type: string
                    maxItems: 32
                    type: array
                  port:
                    format: int32
                    type: integer
                  service:
                    description: 'Service to route to; default: the app name. May
                      use placeholders.'
                    type: string
                  subdomain:
                    description: Subdomain of the cell domain the app is reachable
                      at.
                    pattern: ^[a-z]([a-z0-9-]*[a-z0-9])?$
                    type: string
                required:
                - auth
                - port
                - subdomain
                type: object
                x-kubernetes-validations:
                - message: groups need a login (auth mode oidc or proxy)
                  rule: '!has(self.groups) || size(self.groups) == 0 || self.auth.mode
                    != ''none'''
                - message: subdomains auth, api, mcp and console belong to the cell
                    (identity, platform API, MCP gateway and console)
                  rule: '!(self.subdomain in [''auth'', ''api'', ''mcp'', ''console''])'
              backup:
                description: |-
                  BackupPolicy says how often the platform backs the app up outside the
                  cell. Apps without database and volumes are skipped. Backups are kept
                  for 30 days.
                properties:
                  schedule:
                    default: daily
                    enum:
                    - none
                    - hourly
                    - daily
                    - weekly
                    type: string
                type: object
              digests:
                additionalProperties:
                  description: Digest is a sha256 digest of an image index.
                  pattern: ^sha256:[0-9a-f]{64}$
                  type: string
                description: |-
                  Digests maps a version to the sha256 digest of its multi-arch image
                  index. Only the entry of the current version is used: an image gets
                  "@<digest>" appended, templates see it as {{ .app.digest }} (empty
                  without an entry). A version change without a new entry runs by tag.
                maxProperties: 16
                type: object
              health:
                properties:
                  path:
                    default: /
                    type: string
                  timeoutSeconds:
                    default: 300
                    description: TimeoutSeconds after which an unhealthy app needs
                      attention.
                    format: int32
                    type: integer
                type: object
              mcp:
                description: |-
                  MCP is the app's MCP endpoint, if it has one. The cell's gateway
                  offers its tools to the accounts that may use the app.
                properties:
                  path:
                    description: Path of the endpoint, e.g. /mcp.
                    pattern: ^/[A-Za-z0-9._~/-]*$
                    type: string
                required:
                - path
                type: object
              needs:
                description: Needs are shared services the platform provides.
                properties:
                  database:
                    properties:
                      engine:
                        enum:
                        - postgres
                        type: string
                      size:
                        anyOf:
                        - type: integer
                        - type: string
                        default: 1Gi
                        pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                        x-kubernetes-int-or-string: true
                    required:
                    - engine
                    type: object
                    x-kubernetes-validations:
                    - message: resizing the database is not supported yet
                      rule: self.size == oldSelf.size
                  secrets:
                    description: |-
                      Secrets are generated once (key "password") and kept across reinstalls;
                      templates see their names as {{ .secrets.<name> }}.
                    items:
                      type: string
                    type: array
                  volumes:
                    items:
                      description: |-
                        Resizing is not supported yet: a change could grow a volume, but its
                        rollback could not shrink it again.
                      properties:
                        mountPath:
                          description: MountPath in the container (image apps).
                          type: string
                        name:
                          pattern: ^[a-z]([a-z0-9-]*[a-z0-9])?$
                          type: string
                        size:
                          anyOf:
                          - type: integer
                          - type: string
                          pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                          x-kubernetes-int-or-string: true
                      required:
                      - name
                      - size
                      type: object
                      x-kubernetes-validations:
                      - message: resizing a volume is not supported yet
                        rule: self.size == oldSelf.size
                    maxItems: 16
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                type: object
              source:
                description: |-
                  Source says where the app comes from. Strings in it may contain
                  placeholders such as {{ .database.host }} (Go templates, see docs).
                properties:
                  helm:
                    properties:
                      chart:
                        type: string
                      repo:
                        description: Repo is an HTTP chart repository or an OCI registry
                          path (oci://...).
                        pattern: ^(https://|oci://)
                        type: string
                      values:
                        type: object
                        x-kubernetes-preserve-unknown-fields: true
                      version:
                        minLength: 1
                        type: string
                    required:
                    - chart
                    - repo
                    - version
                    type: object
                  image:
                    properties:
                      args:
                        items:
                          type: string
                        type: array
                      command:
                        items:
                          type: string
                        type: array
                      env:
                        items:
                          description: EnvVar represents an environment variable present
                            in a Container.
                          properties:
                            name:
                              description: |-
                                Name of the environment variable.
                                May consist of any printable ASCII characters except '='.
                              type: string
                            value:
                              description: |-
                                Variable references $(VAR_NAME) are expanded
                                using the previously defined environment variables in the container and
                                any service environment variables. If a variable cannot be resolved,
                                the reference in the input string will be unchanged. Double $$ are reduced
                                to a single $, which allows for escaping the $(VAR_NAME) syntax: i.e.
                                "$$(VAR_NAME)" will produce the string literal "$(VAR_NAME)".
                                Escaped references will never be expanded, regardless of whether the variable
                                exists or not.
                                Defaults to "".
                              type: string
                            valueFrom:
                              description: Source for the environment variable's value.
                                Cannot be used if value is not empty.
                              properties:
                                configMapKeyRef:
                                  description: Selects a key of a ConfigMap.
                                  properties:
                                    key:
                                      description: |-
                                        The key to select from the ConfigMap's Data field.
                                        Keys in the BinaryData field are not currently propagated to container env vars.
                                      type: string
                                    name:
                                      default: ""
                                      description: |-
                                        Name of the referent.
                                        This field is effectively required, but due to backwards compatibility is
                                        allowed to be empty. Instances of this type with an empty value here are
                                        almost certainly wrong.
                                        More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                                      type: string
                                    optional:
                                      description: Specify whether the ConfigMap or
                                        its key must be defined
                                      type: boolean
                                  required:
                                  - key
                                  type: object
                                  x-kubernetes-map-type: atomic
                                fieldRef:
                                  description: |-
                                    Selects a field of the pod: supports metadata.name, metadata.namespace, `metadata.labels['<KEY>']`, `metadata.annotations['<KEY>']`,
                                    spec.nodeName, spec.serviceAccountName, status.hostIP, status.podIP, status.podIPs.
                                  properties:
                                    apiVersion:
                                      description: Version of the schema the FieldPath
                                        is written in terms of, defaults to "v1".
                                      type: string
                                    fieldPath:
                                      description: Path of the field to select in
                                        the specified API version.
                                      type: string
                                  required:
                                  - fieldPath
                                  type: object
                                  x-kubernetes-map-type: atomic
                                fileKeyRef:
                                  description: |-
                                    FileKeyRef selects a key of the env file.
                                    Requires the EnvFiles feature gate to be enabled.
                                  properties:
                                    key:
                                      description: |-
                                        The key within the env file. An invalid key will prevent the pod from starting.
                                        The keys defined within a source may consist of any printable ASCII characters except '='.
                                        During Alpha stage of the EnvFiles feature gate, the key size is limited to 128 characters.
                                      type: string
                                    optional:
                                      default: false
                                      description: |-
                                        Specify whether the file or its key must be defined. If the file or key
                                        does not exist, then the env var is not published.
                                        If optional is set to true and the specified key does not exist,
                                        the environment variable will not be set in the Pod's containers.

                                        If optional is set to false and the specified key does not exist,
                                        an error will be returned during Pod creation.
                                      type: boolean
                                    path:
                                      description: |-
                                        The path within the volume from which to select the file.
                                        Must be relative and may not contain the '..' path or start with '..'.
                                      type: string
                                    volumeName:
                                      description: The name of the volume mount containing
                                        the env file.
                                      type: string
                                  required:
                                  - key
                                  - path
                                  - volumeName
                                  type: object
                                  x-kubernetes-map-type: atomic
                                resourceFieldRef:
                                  description: |-
                                    Selects a resource of the container: only resources limits and requests
                                    (limits.cpu, limits.memory, limits.ephemeral-storage, requests.cpu, requests.memory and requests.ephemeral-storage) are currently supported.
                                  properties:
                                    containerName:
                                      description: 'Container name: required for volumes,
                                        optional for env vars'
                                      type: string
                                    divisor:
                                      anyOf:
                                      - type: integer
                                      - type: string
                                      description: Specifies the output format of
                                        the exposed resources, defaults to "1"
                                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                                      x-kubernetes-int-or-string: true
                                    resource:
                                      description: 'Required: resource to select'
                                      type: string
                                  required:
                                  - resource
                                  type: object
                                  x-kubernetes-map-type: atomic
                                secretKeyRef:
                                  description: Selects a key of a secret in the pod's
                                    namespace
                                  properties:
                                    key:
                                      description: The key of the secret to select
                                        from.  Must be a valid secret key.
                                      type: string
                                    name:
                                      default: ""
                                      description: |-
                                        Name of the referent.
                                        This field is effectively required, but due to backwards compatibility is
                                        allowed to be empty. Instances of this type with an empty value here are
                                        almost certainly wrong.
                                        More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                                      type: string
                                    optional:
                                      description: Specify whether the Secret or its
                                        key must be defined
                                      type: boolean
                                  required:
                                  - key
                                  type: object
                                  x-kubernetes-map-type: atomic
                              type: object
                          required:
                          - name
                          type: object
                        type: array
                      files:
                        description: Files are mounted read-only into the container.
                        items:
                          properties:
                            content:
                              type: string
                            executable:
                              type: boolean
                            path:
                              type: string
                          required:
                          - content
                          - path
                          type: object
                        type: array
                      repository:
                        type: string
                      tag:
                        description: Tag defaults to the app version.
                        type: string
                    required:
                    - repository
                    type: object
                type: object
                x-kubernetes-validations:
                - message: set exactly one of helm or image
                  rule: has(self.helm) != has(self.image)
                - message: switching between helm and image is not supported; remove
                    and reinstall the app
                  rule: has(self.helm) == has(oldSelf.helm)
              title:
                type: string
              version:
                description: Version of the app; templates see it as {{ .app.version
                  }}.
                minLength: 1
                type: string
            required:
            - access
            - source
            - version
            type: object
          status:
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastBackup:
                description: LastBackup is the newest completed backup.
                properties:
                  at:
                    format: date-time
                    type: string
                  name:
                    type: string
                required:
                - at
                - name
                type: object
              mcpEndpoint:
                description: |-
                  MCPEndpoint is where the cell's gateway reaches the app's MCP
                  endpoint; set once the app's service is up.
                type: string
              observedGeneration:
                format: int64
                type: integer
              pausedBy:
                description: PausedBy names the Restore the operator stopped managing
                  the app for.
                type: string
              phase:
                enum:
                - Installing
                - Ready
                - Updating
                - RollingBack
                - Restoring
                - NeedsAttention
                - Removing
                type: string
              url:
                type: string
              version:
                type: string
              workloadGeneration:
                description: |-
                  WorkloadGeneration is the spec generation the operator configured the
                  workloads for (for Helm apps: and Flux applied) since the app was last
                  paused; 0 while paused.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: name must be a DNS label of at most 40 characters
          rule: self.metadata.name.matches('^[a-z]([a-z0-9-]{0,38}[a-z0-9])?$')
        - message: names starting with cell- belong to the platform (its own clients
            in the identity)
          rule: '!self.metadata.name.startsWith(''cell-'')'
    served: true
    storage: true
    subresources:
      status: {}
