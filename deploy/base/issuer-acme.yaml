# Cells with a public domain: Let's Encrypt via HTTP-01 on Traefik.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: cell
spec:
  acme:
    email: ${CELL_ACME_EMAIL}
    server: ${CELL_ACME_SERVER}
    privateKeySecretRef:
      name: cell-acme
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
