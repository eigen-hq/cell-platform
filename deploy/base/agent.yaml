# The cell's agents (E-97). For each, the operator makes an account in the
# identity, its credentials (Secret cell-agent-<name>) and Deployment
# cell-agent-<name>. An agent has no rights in the cluster: it works only
# through the platform API, which checks every call against its Agent. It
# reaches its model through the model gateway (models.yaml); without a
# provider set, tasks wait.
apiVersion: cell.internal/v1alpha1
kind: Agent
metadata:
  name: ops
spec:
  # Finds out why an app needs attention and answers what admins ask.
  kinds: [diagnose, ask]
  apps: ["*"]
  tools: ["*"]
---
apiVersion: cell.internal/v1alpha1
kind: Agent
metadata:
  name: packer
spec:
  # Makes a manifest of a Compose file and proposes installing it: it
  # cannot restart, restore or remove an app.
  kinds: [package]
  apps: ["*"]
  tools: [listCatalog, getCatalogEntry, installApp, getApp]
