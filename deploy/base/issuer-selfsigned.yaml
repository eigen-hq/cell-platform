# Local cells: a cell-owned root CA. Every app certificate is issued by the
# ClusterIssuer "cell"; its CA lives in cert-manager/cell-ca.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: cell-selfsigned
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: cell-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: cell-ca ${CELL_DOMAIN}
  secretName: cell-ca
  duration: 87600h
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: cell-selfsigned
    kind: ClusterIssuer
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: cell
spec:
  ca:
    secretName: cell-ca
