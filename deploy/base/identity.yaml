# Identity: authentik on its own CloudNativePG database.
# Credentials are created once by bootstrap.sh (secrets identity-db-credentials,
# identity and identity-platform) and never leave the cell.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: identity-db
  namespace: cell-system
spec:
  imageName: ghcr.io/cloudnative-pg/postgresql:${POSTGRES_VERSION}
  instances: 1
  storage:
    size: 2Gi
  bootstrap:
    initdb:
      database: authentik
      owner: authentik
      secret:
        name: identity-db-credentials
---
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: authentik
  namespace: kube-system
spec:
  repo: https://charts.goauthentik.io
  chart: authentik
  version: ${AUTHENTIK_CHART_VERSION}
  targetNamespace: cell-system
  valuesContent: |
    global:
      image:
        digest: ${AUTHENTIK_DIGEST}
    authentik:
      existingSecret:
        secretName: identity
    postgresql:
      enabled: false
    # The platform's own account (E-77): the worker applies the blueprint
    # with the token key from Secret identity-platform.
    blueprints:
      configMaps:
        - identity-blueprints
    worker:
      env:
        - name: CELL_PLATFORM_TOKEN
          valueFrom:
            secretKeyRef:
              name: identity-platform
              key: token
    server:
      # Gunicorn restarts a worker every 1000 requests by default. That drops
      # the embedded outpost's websocket, which reconnects only after 300 s
      # and misses updates until then: a new proxy app waited that long.
      env:
        - name: AUTHENTIK_WEB__MAX_REQUESTS
          value: "0"
      ingress:
        enabled: true
        ingressClassName: traefik
        annotations:
          cert-manager.io/cluster-issuer: cell
        hosts:
          - auth.${CELL_DOMAIN}
        tls:
          - secretName: auth-tls
            hosts:
              - auth.${CELL_DOMAIN}
---
# The account operator and API use instead of the bootstrap token (E-77):
# a service account in a superuser group of its own, because only a
# superuser may create app passwords for other users. The group is declared
# here: authentik applies blueprints in no set order and retries a failed
# one only hourly, so this one must not wait for "authentik Admins".
# authentik applies a blueprint again only when the file changes, so the
# token key is set when the account is made (a Secret recreated by hand
# later is not taken over; the installer then stops with an error).
apiVersion: v1
kind: ConfigMap
metadata:
  name: identity-blueprints
  namespace: cell-system
data:
  platform.yaml: |
    version: 1
    metadata:
      name: cell platform account
    context:
      token: !Env [CELL_PLATFORM_TOKEN, null]
    entries:
      - model: authentik_core.group
        state: created
        id: platform-group
        identifiers:
          name: cell-platform
        attrs:
          is_superuser: true
      - model: authentik_core.user
        state: present
        id: platform-user
        identifiers:
          username: cell-platform
        attrs:
          name: cell platform
          type: service_account
          is_active: true
          groups:
            - !KeyOf platform-group
      - model: authentik_core.token
        state: present
        conditions:
          - !If [!Context token]
        identifiers:
          identifier: cell-platform-token
        attrs:
          user: !KeyOf platform-user
          intent: api
          expiring: false
          key: !Context token
          description: cell platform (operator and API)
