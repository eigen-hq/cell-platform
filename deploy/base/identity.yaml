# Identity: authentik on its own CloudNativePG database.
# Credentials are created once by bootstrap.sh (secrets identity-db-credentials,
# identity and identity-platform) and never leave the cell.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: identity-db
  namespace: cell-system
spec:
  imageName: ghcr.io/cloudnative-pg/postgresql:${POSTGRES_VERSION}
  instances: 1
  storage:
    size: 2Gi
  bootstrap:
    initdb:
      database: authentik
      owner: authentik
      secret:
        name: identity-db-credentials
---
# Only the cell's own services and the database operator reach the identity
# database; apps run in the same pod network.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: identity-db
  namespace: cell-system
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: identity-db
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cell-system
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
---
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: authentik
  namespace: kube-system
spec:
  repo: https://charts.goauthentik.io
  chart: authentik
  version: ${AUTHENTIK_CHART_VERSION}
  targetNamespace: cell-system
  valuesContent: |
    global:
      image:
        digest: ${AUTHENTIK_DIGEST}
      # The invite mail (E-79): authentik checks a stage's template against
      # the files of the process that saves it, so server and worker both.
      volumes:
        - name: mail-templates
          configMap:
            name: identity-mail-templates
      volumeMounts:
        - name: mail-templates
          mountPath: /templates
    authentik:
      existingSecret:
        secretName: identity
    postgresql:
      enabled: false
    # The platform's own account (E-77): the worker applies the blueprint
    # with the token key from Secret identity-platform.
    blueprints:
      configMaps:
        - identity-blueprints
    worker:
      env:
        - name: CELL_PLATFORM_TOKEN
          valueFrom:
            secretKeyRef:
              name: identity-platform
              key: token
    server:
      # Gunicorn restarts a worker every 1000 requests by default. That drops
      # the embedded outpost's websocket, which reconnects only after 300 s
      # and misses updates until then: a new proxy app waited that long.
      env:
        - name: AUTHENTIK_WEB__MAX_REQUESTS
          value: "0"
      ingress:
        enabled: true
        ingressClassName: traefik
        annotations:
          cert-manager.io/cluster-issuer: cell
        hosts:
          - auth.${CELL_DOMAIN}
        tls:
          - secretName: auth-tls
            hosts:
              - auth.${CELL_DOMAIN}
---
# The account operator and API use instead of the bootstrap token (E-77):
# a service account in a superuser group of its own, because only a
# superuser may create app passwords for other users. The group is declared
# here: authentik applies blueprints in no set order and retries a failed
# one only hourly, so this one must not wait for "authentik Admins".
# authentik applies a blueprint again only when the file changes, so the
# token key is set when the account is made (a Secret recreated by hand
# later is not taken over; the installer then stops with an error).
apiVersion: v1
kind: ConfigMap
metadata:
  name: identity-blueprints
  namespace: cell-system
data:
  # The login page shows the cell, not the identity product: a sign-in page
  # in another product's look on this domain is what browsers flag as
  # phishing. The console serves the mark.
  brand.yaml: |
    version: 1
    metadata:
      name: cell brand
    entries:
      # The built-in default brand first, so this never creates a brand of
      # its own on a fresh cell.
      - model: authentik_blueprints.metaapplyblueprint
        attrs:
          identifiers:
            name: Default - Brand
          required: true
      - model: authentik_brands.brand
        state: present
        identifiers:
          domain: authentik-default
        attrs:
          branding_title: ${CELL_DOMAIN}
          branding_logo: https://console.${CELL_DOMAIN}/favicon.svg
          branding_favicon: https://console.${CELL_DOMAIN}/favicon.svg
  platform.yaml: |
    version: 1
    metadata:
      name: cell platform account
    context:
      token: !Env [CELL_PLATFORM_TOKEN, null]
    entries:
      - model: authentik_core.group
        state: created
        id: platform-group
        identifiers:
          name: cell-platform
        attrs:
          is_superuser: true
      - model: authentik_core.user
        state: present
        id: platform-user
        identifiers:
          username: cell-platform
        attrs:
          name: cell platform
          type: service_account
          is_active: true
          groups:
            - !KeyOf platform-group
      - model: authentik_core.token
        state: present
        conditions:
          - !If [!Context token]
        identifiers:
          identifier: cell-platform-token
        attrs:
          user: !KeyOf platform-user
          intent: api
          expiring: false
          key: !Context token
          description: cell platform (operator and API)
  # Invites (E-79): the API makes a recovery link of the person on this
  # flow (it sets it as the brand's recovery flow). The link brings the
  # person along; without one the flow does not open. The person sets a
  # password and a second factor, then is signed in.
  invite.yaml: |
    version: 1
    metadata:
      name: cell invite
    entries:
      - model: authentik_flows.flow
        id: flow
        identifiers:
          slug: cell-invite
        attrs:
          name: Invite
          title: Set up your account
          designation: recovery
          authentication: require_unauthenticated
      - model: authentik_policies_expression.expressionpolicy
        id: with-link
        identifiers:
          name: cell-invite-only-with-link
        attrs:
          expression: |
            return bool(request.context.get("pending_user"))
      - model: authentik_policies.policybinding
        identifiers:
          policy: !KeyOf with-link
          target: !KeyOf flow
          order: 0
        attrs:
          enabled: true
          negate: false
          timeout: 30
      - model: authentik_stages_prompt.prompt
        id: password
        identifiers:
          name: cell-invite-password
        attrs:
          field_key: password
          label: Password
          type: password
          required: true
          placeholder: Password
          order: 0
          placeholder_expression: false
      - model: authentik_stages_prompt.prompt
        id: password-repeat
        identifiers:
          name: cell-invite-password-repeat
        attrs:
          field_key: password_repeat
          label: Password (repeat)
          type: password
          required: true
          placeholder: Password (repeat)
          order: 1
          placeholder_expression: false
      - model: authentik_stages_prompt.promptstage
        id: set-password
        identifiers:
          name: cell-invite-set-password
        attrs:
          fields:
            - !KeyOf password
            - !KeyOf password-repeat
          validation_policies: []
      - model: authentik_stages_user_write.userwritestage
        id: write
        identifiers:
          name: cell-invite-write
        attrs:
          user_creation_mode: never_create
      - model: authentik_stages_authenticator_totp.authenticatortotpstage
        id: totp
        identifiers:
          name: cell-invite-totp
        attrs:
          digits: 6
      - model: authentik_stages_authenticator_webauthn.authenticatorwebauthnstage
        id: webauthn
        identifiers:
          name: cell-invite-webauthn
      - model: authentik_stages_authenticator_validate.authenticatorvalidatestage
        id: second-factor
        identifiers:
          name: cell-invite-second-factor
        attrs:
          device_classes: [totp, webauthn]
          not_configured_action: configure
          configuration_stages:
            - !KeyOf totp
            - !KeyOf webauthn
      - model: authentik_stages_user_login.userloginstage
        id: login
        identifiers:
          name: cell-invite-login
      - model: authentik_flows.flowstagebinding
        identifiers:
          target: !KeyOf flow
          stage: !KeyOf set-password
          order: 10
        attrs:
          evaluate_on_plan: true
          re_evaluate_policies: false
          policy_engine_mode: any
          invalid_response_action: retry
      - model: authentik_flows.flowstagebinding
        identifiers:
          target: !KeyOf flow
          stage: !KeyOf write
          order: 20
        attrs:
          evaluate_on_plan: true
          re_evaluate_policies: false
          policy_engine_mode: any
          invalid_response_action: retry
      - model: authentik_flows.flowstagebinding
        identifiers:
          target: !KeyOf flow
          stage: !KeyOf second-factor
          order: 30
        attrs:
          evaluate_on_plan: true
          re_evaluate_policies: false
          policy_engine_mode: any
          invalid_response_action: retry
      - model: authentik_flows.flowstagebinding
        identifiers:
          target: !KeyOf flow
          stage: !KeyOf login
          order: 40
        attrs:
          evaluate_on_plan: true
          re_evaluate_policies: false
          policy_engine_mode: any
          invalid_response_action: retry
---
# The invite mail (E-79), in authentik's mail layout.
apiVersion: v1
kind: ConfigMap
metadata:
  name: identity-mail-templates
  namespace: cell-system
data:
  cell-invite.html: |
    {% extends "email/base.html" %}
    {% load i18n %}
    {% load humanize %}
    {% block content %}
    <tr>
      <td align="center">
        <h1>{% blocktrans with name=user.name %}Hi {{ name }},{% endblocktrans %}</h1>
      </td>
    </tr>
    <tr>
      <td align="center">
        <table border="0">
          <tr>
            <td align="center" style="max-width: 300px; padding: 20px 0; color: #212124;">
              {% blocktrans with username=user.username %}You have an account at ${CELL_DOMAIN}: {{ username }}. Use the button below to set your password and a second factor.{% endblocktrans %}
            </td>
          </tr>
          <tr>
            <td align="center" class="btn btn-primary">
              <a id="confirm" href="{{ url }}" rel="noopener noreferrer" target="_blank">{% trans 'Set up your account' %}</a>
            </td>
          </tr>
        </table>
      </td>
    </tr>
    {% endblock %}
    {% block sub_content %}
    <tr>
      <td style="padding: 20px; font-size: 12px; color: #212124;" align="center">
        {% blocktrans with expires=expires|date:"j F Y, H:i e" %}The link is valid until {{ expires }} and signs in as you: do not pass it on. If you did not expect this mail, ignore it.{% endblocktrans %}
      </td>
    </tr>
    {% endblock %}
  cell-invite.txt: |
    {% load i18n %}{% load humanize %}{% autoescape off %}{% blocktrans with name=user.name %}Hi {{ name }},{% endblocktrans %}

    {% blocktrans with username=user.username %}You have an account at ${CELL_DOMAIN}: {{ username }}. Open the link below to set your password and a second factor.{% endblocktrans %}
    {{ url }}

    {% blocktrans with expires=expires|date:"j F Y, H:i e" %}The link is valid until {{ expires }} and signs in as you: do not pass it on. If you did not expect this mail, ignore it.{% endblocktrans %}
    {% endautoescape %}
