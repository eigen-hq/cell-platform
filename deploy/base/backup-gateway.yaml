# The backup gateway (E-47): the only holder of the backup target's
# credentials. Apps reach it over S3 with a key of their own; its auth proxy
# turns that key into a backend rooted at <root>/apps/<app> of the target,
# so an app sees and writes only its own backups. The target is any rclone
# remote, named "target" in the rclone.conf of Secret backup-target.
# An app's database archive is encrypted here, before it leaves the cell
# (E-67); restic encrypts the volumes itself.
apiVersion: v1
kind: ConfigMap
metadata:
  name: backup-gateway
  namespace: cell-system
data:
  # Input: {"user": "<access key id>", ...}. The key id is the app's name,
  # or "<app>.db" for its database archive; its secret is
  # sha256("<gateway key>:<key id>") (see internal/controller). The archive
  # is an rclone crypt remote at <root>/apps/<app>/crypt, keyed by the
  # backup password and the app alone: a fresh cell with the same backup
  # key reads it. Its one bucket, postgres, always exists: the database
  # tools create a bucket only when a database starts (barman 3.20.1), and
  # an empty one is gone on a new target or after a gateway restart. A
  # combine remote serves it as a fixed directory; nothing is written
  # before the key is checked.
  proxy: |
    #!/bin/sh
    set -eu
    user=$(tr -d '\n' | sed -n 's/.*"user" *: *"\([^"]*\)".*/\1/p')
    app=${user%.db}
    case "$app" in '' | *[!a-z0-9-]* | -* | *-) echo "bad access key id" >&2; exit 1 ;; esac
    # A JSON string value: backslash and quote escaped.
    json() { printf %s "$1" | sed 's/\\/\\\\/g; s/"/\\"/g'; }
    key=$(cat /target/gatewayKey)
    root=$(cat /target/root)
    secret=$(printf '%s:%s' "$key" "$user" | sha256sum | cut -c1-64)
    if [ "$user" = "$app" ]; then
      printf '{"type":"alias","remote":"target:%s/apps/%s","_root":"","_secret_access_key":"%s"}\n' "$(json "$root")" "$app" "$secret"
      exit
    fi
    password=$(cat /target/password)
    [ -n "$password" ] || { echo "no backup password" >&2; exit 1; }
    pass=$(printf 'crypt:%s:%s' "$app" "$password" | sha256sum | cut -c1-64)
    salt=$(printf 'crypt-salt:%s:%s' "$app" "$password" | sha256sum | cut -c1-64)
    # The upstream is one entry of a space-separated list, so it is quoted
    # as a whole with its double quotes doubled; inside, a single quote in a
    # quoted value is doubled. The passwords are obscured here, not by rclone.
    pass=$(rclone obscure "$pass")
    salt=$(rclone obscure "$salt")
    qroot=$(printf %s "$root" | sed "s/'/''/g")
    upstream="postgres=:crypt,remote='target:$qroot/apps/$app/crypt',password='$pass',password2='$salt':postgres"
    upstream=\"$(printf %s "$upstream" | sed 's/"/""/g')\"
    printf '{"type":"combine","upstreams":"%s","_root":"","_secret_access_key":"%s"}\n' "$(json "$upstream")" "$secret"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backup-gateway
  namespace: cell-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: backup-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backup-gateway
    spec:
      # A path target lives on the first machine.
      nodeSelector:
        node-role.kubernetes.io/control-plane: "true"
      containers:
        - name: rclone
          image: rclone/rclone:${RCLONE_VERSION}
          args: [serve, s3, --auth-proxy, /proxy/proxy, --addr, ":8080"]
          env:
            - name: RCLONE_CONFIG
              value: /target/rclone.conf
          ports:
            - name: s3
              containerPort: 8080
          readinessProbe:
            tcpSocket: {port: s3}
          volumeMounts:
            - {name: target, mountPath: /target, readOnly: true}
            - {name: proxy, mountPath: /proxy, readOnly: true}
            - {name: local, mountPath: /backup}
          resources:
            requests: {cpu: 20m, memory: 64Mi}
            limits: {memory: 512Mi}
      volumes:
        - name: target
          secret:
            secretName: backup-target
            defaultMode: 0400
            items:
              - {key: rclone.conf, path: rclone.conf}
              - {key: root, path: root}
              - {key: gatewayKey, path: gatewayKey}
              - {key: password, path: password}
        - name: proxy
          configMap: {name: backup-gateway, defaultMode: 0555}
        - name: local
          ${BACKUP_LOCAL_VOLUME}
---
apiVersion: v1
kind: Service
metadata:
  name: backup-gateway
  namespace: cell-system
spec:
  selector:
    app.kubernetes.io/name: backup-gateway
  ports:
    - {name: s3, port: 8080, targetPort: s3}
