# The platform API. Its account writes only ChangeRequests (proposals and
# an admin's decision), Backups, Tasks, join keys and the request for a new
# backup target; the operator alone changes apps.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cell-api
  namespace: cell-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cell-api
rules:
  - apiGroups: [cell.internal]
    resources: [apps, backups, restores]
    verbs: [get, list, watch]
  - apiGroups: [cell.internal]
    resources: [backups]
    verbs: [create]
  - apiGroups: [cell.internal]
    resources: [changerequests]
    verbs: [get, list, watch, create, update]
  # An install says whether it takes over data a removed app left behind.
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get]
  # Tasks for agents: created by admins, claimed, recorded and finished by
  # agents through the API.
  - apiGroups: [cell.internal]
    resources: [tasks]
    verbs: [get, list, watch, create]
  - apiGroups: [cell.internal]
    resources: [tasks/status]
    verbs: [update]
  # Checking a manifest before anyone approves it: dry runs only, see the
  # policy cell-api-dry-run below.
  - apiGroups: [cell.internal]
    resources: [apps]
    verbs: [create]
  # What admins and agents read when an app is in trouble.
  - apiGroups: [""]
    resources: [pods, events]
    verbs: [list]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  # The machines of the cell (E-44), what they use and their disks.
  - apiGroups: [""]
    resources: [nodes]
    verbs: [list]
  - apiGroups: [metrics.k8s.io]
    resources: [nodes]
    verbs: [list]
  - apiGroups: [longhorn.io]
    resources: [nodes]
    verbs: [list]
---
# Join keys for new machines: bootstrap tokens in kube-system. The API only
# creates them, and only as join keys (policy cell-api-join-keys below).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cell-api-join-keys
  namespace: kube-system
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cell-api-join-keys
  namespace: kube-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cell-api-join-keys
subjects:
  - kind: ServiceAccount
    name: cell-api
    namespace: cell-system
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: cell-api-join-keys
spec:
  failurePolicy: Fail
  matchConstraints:
    namespaceSelector:
      matchLabels: {kubernetes.io/metadata.name: kube-system}
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["*"]
        operations: [CREATE]
        resources: [secrets]
  matchConditions:
    - name: api
      expression: "request.userInfo.username == 'system:serviceaccount:cell-system:cell-api'"
  # Secret data is base64 here: the group is
  # system:bootstrappers:k3s:default-node-token.
  validations:
    - expression: >-
        object.type == 'bootstrap.kubernetes.io/token' &&
        object.metadata.name.startsWith('bootstrap-token-') &&
        has(object.data) && 'auth-extra-groups' in object.data &&
        object.data['auth-extra-groups'] == 'c3lzdGVtOmJvb3RzdHJhcHBlcnM6azNzOmRlZmF1bHQtbm9kZS10b2tlbg==' &&
        'expiration' in object.data
      message: "the platform API only creates join keys for machines (k3s bootstrap tokens with an expiry)"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: cell-api-join-keys
spec:
  policyName: cell-api-join-keys
  validationActions: [Deny]
---
# The backup target: the API reads what the operator tells about it and
# asks for a new one with a request the operator checks (only that one
# secret name, policy cell-api-backup-target below). The target's own
# secret stays out of reach.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cell-api-backup-target
  namespace: cell-system
rules:
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [backup-target-status]
    verbs: [get]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cell-api-backup-target
  namespace: cell-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cell-api-backup-target
subjects:
  - kind: ServiceAccount
    name: cell-api
    namespace: cell-system
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: cell-api-backup-target
spec:
  failurePolicy: Fail
  matchConstraints:
    namespaceSelector:
      matchLabels: {kubernetes.io/metadata.name: cell-system}
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["*"]
        operations: [CREATE]
        resources: [secrets]
  matchConditions:
    - name: api
      expression: "request.userInfo.username == 'system:serviceaccount:cell-system:cell-api'"
  validations:
    - expression: "object.metadata.name == 'backup-target-request' && object.type == 'Opaque'"
      message: "in cell-system the platform API only creates the request for a new backup target"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: cell-api-backup-target
spec:
  policyName: cell-api-backup-target
  validationActions: [Deny]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cell-api
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cell-api
subjects:
  - kind: ServiceAccount
    name: cell-api
    namespace: cell-system
---
# The API checks apps against the cluster's schema and rules before an
# admin approves them, with a dry run. It never creates one: the operator
# installs apps after approval (E-30).
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: cell-api-dry-run
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [cell.internal]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE, DELETE]
        resources: [apps]
  matchConditions:
    - name: api
      expression: "request.userInfo.username == 'system:serviceaccount:cell-system:cell-api'"
  validations:
    - expression: "has(request.dryRun) && request.dryRun"
      message: "the platform API only checks apps (dry run); the operator installs them after approval"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: cell-api-dry-run
spec:
  policyName: cell-api-dry-run
  validationActions: [Deny]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cell-api
  namespace: cell-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cell-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cell-api
    spec:
      serviceAccountName: cell-api
      # The platform image is built on the first machine, for its architecture.
      nodeSelector:
        node-role.kubernetes.io/control-plane: "true"
      containers:
        - name: api
          image: ${OPERATOR_IMAGE}
          imagePullPolicy: IfNotPresent
          command: [/api]
          env:
            - name: CELL_DOMAIN
              value: ${CELL_DOMAIN}
            # The web console, built into the image (console.<domain>).
            - name: CONSOLE_DIR
              value: /console
            # Machines join on this address; empty: the cell takes no more.
            - name: CELL_JOIN_SERVER
              value: "${CELL_JOIN_SERVER}"
            - name: AUTHENTIK_TOKEN
              valueFrom:
                secretKeyRef:
                  name: identity
                  key: AUTHENTIK_BOOTSTRAP_TOKEN
            # The mesh's login client (E-56); without it, the cell has no mesh.
            - name: MESH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: mesh-oidc
                  key: client_secret
                  optional: true
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: {path: /healthz, port: http}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
          # Keep serving while the ingress stops sending requests to this
          # pod; without it, a rollout drops requests.
          lifecycle:
            preStop:
              sleep: {seconds: 5}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
---
apiVersion: v1
kind: Service
metadata:
  name: cell-api
  namespace: cell-system
spec:
  selector:
    app.kubernetes.io/name: cell-api
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cell-api
  namespace: cell-system
  annotations:
    cert-manager.io/cluster-issuer: cell
spec:
  ingressClassName: traefik
  tls:
    - secretName: api-tls
      hosts: [api.${CELL_DOMAIN}]
  rules:
    - host: api.${CELL_DOMAIN}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cell-api
                port: {name: http}
---
# The web console: the API serves it on its own host, so the console calls
# the API on the same origin.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cell-console
  namespace: cell-system
  annotations:
    cert-manager.io/cluster-issuer: cell
spec:
  ingressClassName: traefik
  tls:
    - secretName: console-tls
      hosts: [console.${CELL_DOMAIN}]
  rules:
    - host: console.${CELL_DOMAIN}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cell-api
                port: {name: http}
