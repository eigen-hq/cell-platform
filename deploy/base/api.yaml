# The platform API. Its account writes only ChangeRequests (proposals and
# an admin's decision), Backups and Tasks; the operator alone changes apps.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cell-api
  namespace: cell-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cell-api
rules:
  - apiGroups: [cell.internal]
    resources: [apps, backups, restores]
    verbs: [get, list, watch]
  - apiGroups: [cell.internal]
    resources: [backups]
    verbs: [create]
  - apiGroups: [cell.internal]
    resources: [changerequests]
    verbs: [get, list, watch, create, update]
  # An install says whether it takes over data a removed app left behind.
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get]
  # Tasks for agents: created by admins, claimed, recorded and finished by
  # agents through the API.
  - apiGroups: [cell.internal]
    resources: [tasks]
    verbs: [get, list, watch, create]
  - apiGroups: [cell.internal]
    resources: [tasks/status]
    verbs: [update]
  # Checking a manifest before anyone approves it: dry runs only, see the
  # policy cell-api-dry-run below.
  - apiGroups: [cell.internal]
    resources: [apps]
    verbs: [create]
  # What admins and agents read when an app is in trouble.
  - apiGroups: [""]
    resources: [pods, events]
    verbs: [list]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cell-api
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cell-api
subjects:
  - kind: ServiceAccount
    name: cell-api
    namespace: cell-system
---
# The API checks apps against the cluster's schema and rules before an
# admin approves them, with a dry run. It never creates one: the operator
# installs apps after approval (E-30).
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: cell-api-dry-run
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [cell.internal]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE, DELETE]
        resources: [apps]
  matchConditions:
    - name: api
      expression: "request.userInfo.username == 'system:serviceaccount:cell-system:cell-api'"
  validations:
    - expression: "has(request.dryRun) && request.dryRun"
      message: "the platform API only checks apps (dry run); the operator installs them after approval"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: cell-api-dry-run
spec:
  policyName: cell-api-dry-run
  validationActions: [Deny]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cell-api
  namespace: cell-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cell-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cell-api
    spec:
      serviceAccountName: cell-api
      containers:
        - name: api
          image: ${OPERATOR_IMAGE}
          imagePullPolicy: IfNotPresent
          command: [/api]
          env:
            - name: AUTHENTIK_TOKEN
              valueFrom:
                secretKeyRef:
                  name: identity
                  key: AUTHENTIK_BOOTSTRAP_TOKEN
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: {path: /healthz, port: http}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
          # Keep serving while the ingress stops sending requests to this
          # pod; without it, a rollout drops requests.
          lifecycle:
            preStop:
              sleep: {seconds: 5}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
---
apiVersion: v1
kind: Service
metadata:
  name: cell-api
  namespace: cell-system
spec:
  selector:
    app.kubernetes.io/name: cell-api
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cell-api
  namespace: cell-system
  annotations:
    cert-manager.io/cluster-issuer: cell
spec:
  ingressClassName: traefik
  tls:
    - secretName: api-tls
      hosts: [api.${CELL_DOMAIN}]
  rules:
    - host: api.${CELL_DOMAIN}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cell-api
                port: {name: http}
