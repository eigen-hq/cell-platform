# In-cluster snapshots of Longhorn volumes (type snap; off-cell backups are a
# separate concern, see E-23 to E-28).
apiVersion: snapshot.storage.k8s.io/v1
kind: VolumeSnapshotClass
metadata:
  name: longhorn-snapshot
  annotations:
    snapshot.storage.kubernetes.io/is-default-class: "true"
driver: driver.longhorn.io
deletionPolicy: Delete
parameters:
  type: snap
---
# The platform API reads the machines' disks (E-70).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cell-api-disks
  namespace: longhorn-system
rules:
  - apiGroups: [longhorn.io]
    resources: [nodes]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cell-api-disks
  namespace: longhorn-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cell-api-disks
subjects:
  - kind: ServiceAccount
    name: cell-api
    namespace: cell-system
