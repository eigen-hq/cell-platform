# The App operator. Its only write path into apps is this ServiceAccount.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cell-operator
  namespace: cell-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cell-operator
rules:
  - apiGroups: [cell.internal]
    resources: [apps, apps/status, apps/finalizers, backups, backups/status, restores, restores/status, changerequests, changerequests/status]
    verbs: ["*"]
  # An app that needs attention gets a diagnose task for the ops agent.
  - apiGroups: [cell.internal]
    resources: [tasks]
    verbs: [get, list, watch, create]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, watch, create, delete]
  - apiGroups: [batch]
    resources: [cronjobs]
    verbs: [get, list, watch, patch]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [statefulsets]
    verbs: [get, list, watch, update, patch]
  - apiGroups: [postgresql.cnpg.io]
    resources: [backups]
    verbs: [get, list, watch, create, delete]
  - apiGroups: [barmancloud.cnpg.io]
    resources: [objectstores]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [namespaces, configmaps, secrets, services, persistentvolumeclaims]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses, networkpolicies]
    verbs: [get, list, watch, create, update, patch, delete]
  # Helm apps are deployed by their own ServiceAccount, admin of the app's
  # namespace only.
  - apiGroups: [""]
    resources: [serviceaccounts]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [rolebindings]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [clusterroles]
    resourceNames: [admin]
    verbs: [bind]
  - apiGroups: [postgresql.cnpg.io]
    resources: [clusters]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [helm.toolkit.fluxcd.io]
    resources: [helmreleases]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [source.toolkit.fluxcd.io]
    resources: [helmrepositories, ocirepositories]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [traefik.io]
    resources: [middlewares]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [cert-manager.io]
    resources: [certificates]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cell-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cell-operator
subjects:
  - kind: ServiceAccount
    name: cell-operator
    namespace: cell-system
---
# Join keys: once a machine has joined, the operator deletes every join key
# made before it (E-64). It lists the k3s join tokens in kube-system and
# deletes nothing else there (policy cell-operator-join-keys).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cell-operator-nodes
rules:
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cell-operator-nodes
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cell-operator-nodes
subjects:
  - kind: ServiceAccount
    name: cell-operator
    namespace: cell-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cell-operator-join-keys
  namespace: kube-system
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [list, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cell-operator-join-keys
  namespace: kube-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cell-operator-join-keys
subjects:
  - kind: ServiceAccount
    name: cell-operator
    namespace: cell-system
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: cell-operator-join-keys
spec:
  failurePolicy: Fail
  matchConstraints:
    namespaceSelector:
      matchLabels: {kubernetes.io/metadata.name: kube-system}
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["*"]
        operations: [DELETE]
        resources: [secrets]
  matchConditions:
    - name: operator
      expression: "request.userInfo.username == 'system:serviceaccount:cell-system:cell-operator'"
  # The group, base64: system:bootstrappers:k3s:default-node-token.
  validations:
    - expression: >-
        oldObject.type == 'bootstrap.kubernetes.io/token' &&
        has(oldObject.data) && 'auth-extra-groups' in oldObject.data &&
        oldObject.data['auth-extra-groups'] == 'c3lzdGVtOmJvb3RzdHJhcHBlcnM6azNzOmRlZmF1bHQtbm9kZS10b2tlbg=='
      message: "the operator deletes only join keys in kube-system"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: cell-operator-join-keys
spec:
  policyName: cell-operator-join-keys
  validationActions: [Deny]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cell-operator
  namespace: cell-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cell-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cell-operator
    spec:
      serviceAccountName: cell-operator
      # The platform image is built on the first machine, for its architecture.
      nodeSelector:
        node-role.kubernetes.io/control-plane: "true"
      containers:
        - name: operator
          image: ${OPERATOR_IMAGE}
          imagePullPolicy: IfNotPresent
          env:
            - name: BRIDGE_IMAGE
              value: "${BRIDGE_IMAGE}"
            - name: RESTIC_IMAGE
              value: restic/restic:${RESTIC_VERSION}
            # Checks a backup target an admin sets before the cell uses it.
            - name: RCLONE_IMAGE
              value: rclone/rclone:${RCLONE_VERSION}
            - name: AUTHENTIK_TOKEN
              valueFrom:
                secretKeyRef:
                  name: identity
                  key: AUTHENTIK_BOOTSTRAP_TOKEN
          ports:
            - name: health
              containerPort: 8081
          readinessProbe:
            httpGet: {path: /readyz, port: health}
          livenessProbe:
            httpGet: {path: /healthz, port: health}
          resources:
            requests: {cpu: 10m, memory: 64Mi}
            limits: {memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
