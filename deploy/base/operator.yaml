# The App operator. Its only write path into apps is this ServiceAccount.
# Across the cluster it holds only what is cluster-wide or what it watches
# across apps (E-70); what it writes into an app comes from the RoleBinding
# cell-operator in the app's namespace, which it binds itself.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cell-operator
  namespace: cell-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cell-operator
rules:
  - apiGroups: [cell.internal]
    resources: [apps, apps/status, apps/finalizers, backups, backups/status, restores, restores/status, changerequests, changerequests/status]
    verbs: [get, list, watch, create, update, patch, delete]
  # An app that needs attention gets a diagnose task for the ops agent; the
  # task is marked once IT got the warning. A running task of a deleted
  # agent fails.
  - apiGroups: [cell.internal]
    resources: [tasks]
    verbs: [get, list, watch, create, patch]
  - apiGroups: [cell.internal]
    resources: [tasks/status]
    verbs: [update]
  # The cell's agents (E-97): their Secrets and Deployments belong to them.
  - apiGroups: [cell.internal]
    resources: [agents]
    verbs: [get, list, watch, patch]
  - apiGroups: [cell.internal]
    resources: [agents/finalizers]
    verbs: [update]
  # The watches follow the apps across namespaces; a host is free only if no
  # ingress in the cell uses it.
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, watch]
  - apiGroups: [postgresql.cnpg.io]
    resources: [clusters]
    verbs: [get, list, watch]
  - apiGroups: [helm.toolkit.fluxcd.io]
    resources: [helmreleases]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses]
    verbs: [list]
  # Only app-* namespaces and their RoleBindings (policy cell-operator-scope
  # below). No delete for RoleBindings: they go with the namespace.
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get, create, patch, delete]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [rolebindings]
    verbs: [create, patch]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [clusterroles]
    resourceNames: [admin, cell-operator-app, cell-api-app]
    verbs: [bind]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cell-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cell-operator
subjects:
  - kind: ServiceAccount
    name: cell-operator
    namespace: cell-system
---
# What the operator does inside an app's namespace; bound there by the
# operator (RoleBinding cell-operator). Helm apps are deployed by their own
# ServiceAccount helm-deployer, admin of the app's namespace only.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cell-operator-app
rules:
  - apiGroups: [""]
    resources: [configmaps, secrets, services, persistentvolumeclaims, serviceaccounts]
    verbs: [get, list, create, update, patch, delete]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
  - apiGroups: [apps]
    resources: [deployments, statefulsets]
    verbs: [get, list, create, update, patch, delete]
  - apiGroups: [batch]
    resources: [cronjobs]
    verbs: [get, list, patch]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, create, delete]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses, networkpolicies]
    verbs: [get, list, create, update, patch, delete]
  - apiGroups: [postgresql.cnpg.io]
    resources: [clusters]
    verbs: [get, list, create, update, patch, delete]
  - apiGroups: [postgresql.cnpg.io]
    resources: [backups]
    verbs: [get, list, create, delete]
  - apiGroups: [barmancloud.cnpg.io]
    resources: [objectstores]
    verbs: [get, list, create, update, patch, delete]
  - apiGroups: [helm.toolkit.fluxcd.io]
    resources: [helmreleases]
    verbs: [get, list, create, update, patch, delete]
  - apiGroups: [source.toolkit.fluxcd.io]
    resources: [helmrepositories, ocirepositories]
    verbs: [get, list, create, update, patch, delete]
  - apiGroups: [traefik.io]
    resources: [middlewares]
    verbs: [get, list, create, update, patch, delete]
  - apiGroups: [cert-manager.io]
    resources: [certificates]
    verbs: [get, list, create, update, patch, delete]
---
# The operator in its own namespace: the cell's configuration and host
# claims, the login proxy's ingress per app, the check of a new backup
# target, the restart of the backup gateway and the agents' Deployments
# (E-97). Of the secrets it changes only its own by name; an agent's it
# makes once.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cell-operator
  namespace: cell-system
rules:
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, list, create, update, patch, delete]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list, watch, create]
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [cell-models, backup-target, backup-target-request]
    verbs: [update, delete]
  - apiGroups: [""]
    resources: [pods]
    verbs: [list]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses]
    verbs: [get, create, update, patch, delete]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [create, delete]
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [backup-gateway]
    verbs: [patch]
  # cell-agent-<name>, applied server-side: RBAC cannot match a name
  # prefix. It opens nothing new: the Jobs above can already run any
  # service account of the namespace.
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cell-operator
  namespace: cell-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cell-operator
subjects:
  - kind: ServiceAccount
    name: cell-operator
    namespace: cell-system
---
# The cell's CA and, with the naming service (E-55), its token and the
# accounts of the hosts.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cell-operator
  namespace: cert-manager
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [cell-ca, cell-names, cell-acme-dns]
    verbs: [get]
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [cell-acme-dns]
    verbs: [update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cell-operator
  namespace: cert-manager
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cell-operator
subjects:
  - kind: ServiceAccount
    name: cell-operator
    namespace: cell-system
---
# The operator's cluster-wide writes stay in app namespaces: a namespace
# app-* with Pod Security baseline, and a RoleBinding there only as one of
# three grants.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: cell-operator-scope
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE, DELETE]
        resources: [namespaces]
      - apiGroups: [rbac.authorization.k8s.io]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE, DELETE]
        resources: [rolebindings]
  matchConditions:
    - name: operator
      expression: "request.userInfo.username == 'system:serviceaccount:cell-system:cell-operator'"
  variables:
    - name: obj
      expression: "request.operation == 'DELETE' ? oldObject : object"
    - name: isNamespace
      expression: "request.resource.resource == 'namespaces'"
  validations:
    - expression: "variables.isNamespace ? variables.obj.metadata.name.startsWith('app-') : request.namespace.startsWith('app-')"
      message: "the operator writes namespaces and RoleBindings only for apps (app-*)"
    - expression: >-
        !variables.isNamespace || request.operation == 'DELETE' ||
        (has(object.metadata.labels) && 'pod-security.kubernetes.io/enforce' in object.metadata.labels &&
        object.metadata.labels['pod-security.kubernetes.io/enforce'] == 'baseline')
      message: "an app namespace enforces Pod Security baseline"
    - expression: >-
        variables.isNamespace || request.operation == 'DELETE' ||
        (object.roleRef.kind == 'ClusterRole' && has(object.subjects) && size(object.subjects) == 1 &&
        object.subjects[0].kind == 'ServiceAccount' && has(object.subjects[0].namespace) && (
        (object.roleRef.name == 'admin' && object.subjects[0].name == 'helm-deployer' && object.subjects[0].namespace == request.namespace) ||
        (object.roleRef.name == 'cell-operator-app' && object.subjects[0].name == 'cell-operator' && object.subjects[0].namespace == 'cell-system') ||
        (object.roleRef.name == 'cell-api-app' && object.subjects[0].name == 'cell-api' && object.subjects[0].namespace == 'cell-system')))
      message: "an app's RoleBinding grants admin to its helm-deployer, cell-operator-app to the operator or cell-api-app to the API, nothing else"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: cell-operator-scope
spec:
  policyName: cell-operator-scope
  validationActions: [Deny]
---
# Join keys: once a machine has joined, the operator deletes every join key
# made before it (E-64). It lists the k3s join tokens in kube-system and
# deletes nothing else there (policy cell-operator-join-keys).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cell-operator-nodes
rules:
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cell-operator-nodes
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cell-operator-nodes
subjects:
  - kind: ServiceAccount
    name: cell-operator
    namespace: cell-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cell-operator-join-keys
  namespace: kube-system
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [list, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cell-operator-join-keys
  namespace: kube-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cell-operator-join-keys
subjects:
  - kind: ServiceAccount
    name: cell-operator
    namespace: cell-system
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: cell-operator-join-keys
spec:
  failurePolicy: Fail
  matchConstraints:
    namespaceSelector:
      matchLabels: {kubernetes.io/metadata.name: kube-system}
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["*"]
        operations: [DELETE]
        resources: [secrets]
  matchConditions:
    - name: operator
      expression: "request.userInfo.username == 'system:serviceaccount:cell-system:cell-operator'"
  # The group, base64: system:bootstrappers:k3s:default-node-token.
  validations:
    - expression: >-
        oldObject.type == 'bootstrap.kubernetes.io/token' &&
        has(oldObject.data) && 'auth-extra-groups' in oldObject.data &&
        oldObject.data['auth-extra-groups'] == 'c3lzdGVtOmJvb3RzdHJhcHBlcnM6azNzOmRlZmF1bHQtbm9kZS10b2tlbg=='
      message: "the operator deletes only join keys in kube-system"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: cell-operator-join-keys
spec:
  policyName: cell-operator-join-keys
  validationActions: [Deny]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cell-operator
  namespace: cell-system
spec:
  replicas: 1
  # One operator at a time, also while it is updated: two would both act on
  # what they see, mail a warning twice, say.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: cell-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cell-operator
    spec:
      serviceAccountName: cell-operator
      # The platform image is built on the first machine, for its architecture.
      nodeSelector:
        node-role.kubernetes.io/control-plane: "true"
      containers:
        - name: operator
          image: ${OPERATOR_IMAGE}
          imagePullPolicy: IfNotPresent
          env:
            - name: BRIDGE_IMAGE
              value: "${BRIDGE_IMAGE}"
            # The agents run from the platform image.
            - name: AGENT_IMAGE
              value: "${OPERATOR_IMAGE}"
            - name: RESTIC_IMAGE
              value: restic/restic:${RESTIC_VERSION}
            # Checks a backup target an admin sets before the cell uses it.
            - name: RCLONE_IMAGE
              value: rclone/rclone:${RCLONE_VERSION}
            # Operand of every app database (CloudNativePG would pick its own default).
            - name: POSTGRES_IMAGE
              value: ghcr.io/cloudnative-pg/postgresql:${POSTGRES_VERSION}
            - name: AUTHENTIK_TOKEN
              valueFrom:
                secretKeyRef:
                  name: identity-platform
                  key: token
          ports:
            - name: health
              containerPort: 8081
          readinessProbe:
            httpGet: {path: /readyz, port: health}
          livenessProbe:
            httpGet: {path: /healthz, port: health}
          resources:
            requests: {cpu: 10m, memory: 64Mi}
            limits: {memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
