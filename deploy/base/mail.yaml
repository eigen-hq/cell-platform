# The cell's own mail server (E-84): Postfix, send-only. It takes mail from
# the cell's own services only, signs it with the cell's DKIM key (Secret
# cell-mail-dkim, made by the installer) and delivers it straight to the
# receivers' mail servers on port 25. No mailboxes, no login, no Ingress.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mail-queue
  namespace: cell-system
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mail
  namespace: cell-system
spec:
  replicas: 1
  # One Postfix per queue: the old one stops before the new one starts.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: mail
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mail
    spec:
      automountServiceAccountToken: false
      # On the server, like the API: receivers check the sending address
      # against SPF and its name (PTR), and the installer publishes the
      # server's.
      nodeSelector:
        node-role.kubernetes.io/control-plane: "true"
      containers:
        - name: postfix
          image: ghcr.io/bokysan/postfix:${POSTFIX_VERSION}
          env:
            - name: ALLOWED_SENDER_DOMAINS
              value: ${CELL_DOMAIN}
            - name: POSTFIX_myhostname
              value: mail.${CELL_DOMAIN}
            # Sign with the cell domain's own key: by default rspamd looks
            # for the parent domain's (cell.example.com -> example.com).
            - name: RSPAMD_dkim_signing__use_esld
              value: "false"
          ports:
            - name: submission
              containerPort: 587
          readinessProbe:
            tcpSocket: {port: submission}
            initialDelaySeconds: 10
          volumeMounts:
            - name: queue
              mountPath: /var/spool/postfix
            - name: dkim
              mountPath: /etc/opendkim/keys
              readOnly: true
          resources:
            requests: {cpu: 10m, memory: 96Mi}
            limits: {memory: 384Mi}
          # Postfix starts as root and drops to its own users. No SYS_CHROOT:
          # the image's master.cf runs no service chrooted (postconf -M);
          # submission, DKIM signing and delivery were tested with this set.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
              add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE, FOWNER, NET_BIND_SERVICE, KILL]
      volumes:
        - name: queue
          persistentVolumeClaim:
            claimName: mail-queue
        - name: dkim
          secret:
            secretName: cell-mail-dkim
            items:
              - key: key
                path: ${CELL_DOMAIN}.private
---
apiVersion: v1
kind: Service
metadata:
  name: mail
  namespace: cell-system
spec:
  selector:
    app.kubernetes.io/name: mail
  ports:
    - name: submission
      port: 587
      targetPort: submission
---
# Only the cell's own services send: Postfix relays for any address in its
# networks, and apps run in the same pod network.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mail
  namespace: cell-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mail
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cell-system
      ports:
        - port: 587
