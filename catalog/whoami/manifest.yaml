# Placeholder for a self-built app (e.g. from the office suite): a ready-made
# container without own login. The platform puts it behind the identity's
# login proxy and passes the user as X-authentik-* headers.
apiVersion: cell.internal/v1alpha1
kind: App
metadata:
  name: whoami
spec:
  title: Eigenbau-Platzhalter
  version: "1.12.0"
  # Digest of the multi-arch index of the image for this version, verified
  # 2026-11-26. A new version needs a new entry, or it runs by tag.
  digests:
    "1.12.0": sha256:c4717a8d1f0134a7444e24f881160e033991f23027c6c5a9a3f8fd22e70d1d44
  source:
    image:
      repository: traefik/whoami
      tag: "v{{ .app.version }}"
  access:
    subdomain: whoami
    port: 80
    auth:
      mode: proxy
  health:
    path: /health
    timeoutSeconds: 120
